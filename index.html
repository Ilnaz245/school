<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебный портал 6 класс — Амир и Самир</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
.auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .auth-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            color: var(--text-main);
            background-color: #FAFAFA;
            outline: none;
            transition: all 0.25s ease;
        }

        .auth-input:focus {
            border-color: var(--primary);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        select.auth-input {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c6B7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
        }

        .btn-login {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            margin-top: 8px;
            cursor: pointer;
        }

        .btn-login:hover {
            background: var(--primary-hover);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-main: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --border: #E5E7EB;
            --radius: 16px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Auth Screen */
        #screen-auth {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366F1 0%, #A855F7 100%);
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .auth-card h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .auth-card p {
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .user-buttons {
            display: flex;
            gap: 16px;
            flex-direction: column;
        }

        .user-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .user-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        /* Header */
        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #F3F4F6;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: #E5E7EB;
        }

        /* Container */
        .container {
            max-width: 1100px;
            margin: 32px auto;
            padding: 0 20px;
            width: 100%;
        }

        /* Dashboard Grid */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }

        .subject-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 180px;
        }

        .subject-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .subject-card h3 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .subject-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 12px;
        }

        /* Topics List */
        .topic-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 24px;
        }

        .topic-item {
            background: var(--card-bg);
            padding: 20px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .topic-item:hover {
            transform: translateX(4px);
            border-left: 4px solid var(--primary);
        }

        .topic-info h4 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .topic-info p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-done { background: #D1FAE5; color: #065F46; }
        .badge-todo { background: #FEF3C7; color: #92400E; }

        /* Lesson Screen */
        .lesson-card {
            background: var(--card-bg);
            padding: 36px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 32px;
            line-height: 1.7;
        }

        .lesson-card h2 {
            font-size: 26px;
            margin-bottom: 16px;
            color: var(--primary);
        }

        .lesson-content h3 {
            font-size: 18px;
            margin: 20px 0 10px 0;
        }

        .lesson-content p {
            margin-bottom: 14px;
            color: #374151;
        }

        .quiz-section {
            background: var(--card-bg);
            padding: 36px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .quiz-question {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .quiz-question:last-child {
            border-bottom: none;
        }

        .quiz-question p {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-label:hover {
            background: #F9FAFB;
        }

        /* Profile Screen */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .stat-card h3 {
            margin-bottom: 16px;
            font-size: 20px;
        }

        .progress-bar-container {
            width: 100%;
            background: #E5E7EB;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        .results-table th, .results-table td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .results-table th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
        }

        .grade-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 700;
            color: white;
            font-size: 14px;
        }

        .grade-5 { background: var(--success); }
        .grade-4 { background: #3B82F6; }
        .grade-3 { background: var(--warning); }
        .grade-2 { background: var(--danger); }

        .errors-list {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .error-item {
            padding: 12px 16px;
            background: #FEF2F2;
            border-left: 4px solid var(--danger);
            border-radius: 6px;
            font-size: 14px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .breadcrumb span {
            cursor: pointer;
        }

        .breadcrumb span:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <!-- Экран Входа -->
    <div id="screen-auth" class="screen active">
        <div class="auth-card">
            <h1>Учебный портал</h1>
            <p>Учебный курс за 6 класс</p>
            
            <form onsubmit="handleAuth(event)" class="auth-form">
                <div class="form-group">
                    <label for="user-select" class="form-label">Выберите профиль:</label>
                    <select id="user-select" class="auth-input">
                        <option value="Амир">👤 Амир</option>
                        <option value="Самир">👤 Самир</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password-input" class="form-label">Пароль доступа:</label>
                    <input 
                        type="password" 
                        id="password-input" 
                        class="auth-input" 
                        placeholder="Введите ваш пароль" 
                        required 
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="user-btn btn-login">
                    Войти в портал
                </button>
            </form>
        </div>
    </div>

    <!-- Основное Приложение -->
    <div id="app" style="display: none;">
        <header id="app-header">
            <div class="logo" onclick="nav('dashboard')">
                📚 <span>6 Класс Учёба</span>
            </div>
            <div class="header-controls">
                <span id="user-display" style="font-weight: 600;"></span>
                <button class="btn btn-secondary" onclick="nav('profile')">📊 Личный кабинет</button>
                <button class="btn btn-secondary" onclick="logout()">Выйти</button>
            </div>
        </header>

        <div class="container">
            
            <!-- Дашборд -->
            <div id="screen-dashboard" class="screen">
                <h2>Предметы 6 класса</h2>
                <p style="color: var(--text-muted); margin-bottom: 20px;">Выберите предмет для изучения тем и прохождения тестов:</p>
                <div class="subject-grid" id="dashboard-cards"></div>
            </div>

            <!-- Список тем -->
            <div id="screen-topics" class="screen">
                <div class="breadcrumb">
                    <span onclick="nav('dashboard')">Главная</span> &gt; <span id="bread-subject">Предмет</span>
                </div>
                <h2 id="subject-title">Название предмета</h2>
                <div class="topic-list" id="topics-list"></div>
            </div>

            <!-- Экран урока и теста -->
            <div id="screen-lesson" class="screen">
                <div class="breadcrumb">
                    <span onclick="nav('dashboard')">Главная</span> &gt; 
                    <span id="bread-subject-2" onclick="nav('topics')">Предмет</span> &gt; 
                    <span id="bread-topic">Тема</span>
                </div>
                
                <div id="lesson-content"></div>
            </div>

            <!-- Личный кабинет -->
            <div id="screen-profile" class="screen">
                <div class="breadcrumb">
                    <span onclick="nav('dashboard')">Главная</span> &gt; <span>Личный кабинет</span>
                </div>
                <div id="profile-content"></div>
            </div>

        </div>
    </div>

    <script>
        // БАЗА ДАННЫХ
const PASSWORDS = {
            'Амир': '1111',
            'Самир': '2222'
        };

        // Обработчик отправки формы авторизации
        function handleAuth(event) {
            event.preventDefault();
            
            const userSelect = document.getElementById('user-select');
            const passwordInput = document.getElementById('password-input');
            
            const selectedUser = userSelect.value;
            const enteredPassword = passwordInput.value;

            login(selectedUser, enteredPassword);
        }

        // Обновленная функция авторизации
        function login(username, password) {
            // Проверка пароля
            if (PASSWORDS[username] && PASSWORDS[username] === password) {
                currentUser = username;
                
                // Сохранение текущего пользователя в сессию
                sessionStorage.setItem('currentUser', username);
                
                // Подгрузка данных пользователя из localStorage
                loadUserData();
                
                // Очистка поля ввода пароля для безопасности
                document.getElementById('password-input').value = '';
                
                // Отображение интерфейса приложения и переход на дашборд
                document.getElementById('screen-auth').classList.remove('active');
                document.getElementById('app').style.display = 'block';
                document.getElementById('user-display').textContent = `👤 ${currentUser}`;
                
                nav('dashboard');
            } else {
                alert('Неверный пароль! Пожалуйста, попробуйте еще раз.');
                const passwordInput = document.getElementById('password-input');
                passwordInput.value = '';
                passwordInput.focus();
            }
        }
        const DATABASE = {
            math: {
                topics: [
                    {
                        id: "math_1",
                        title: "1. Среднее арифметическое",
                        page: "Стр. 14",
                        theory: "<strong>Среднее арифметическое</strong> — это число, полученное делением суммы нескольких чисел на их количество. Данная величина широко применяется в статистике, экономике и бытовых расчетах, позволяя оценить обобщенный средний показатель для группы неоднородных значений.<br><br><strong>Алгоритм нахождения среднего арифметического:</strong><ul><li><strong>Шаг 1:</strong> Сложить абсолютно все заданные числа между собой, чтобы получить их общую сумму.</li><li><strong>Шаг 2:</strong> Посчитать точное количество этих чисел в исходном множестве.</li><li><strong>Шаг 3:</strong> Разделить сумму, полученную на первом шаге, на количество чисел из второго шага.</li></ul><br><strong>Пример 1:</strong> Амир получил за неделю по математике оценки 5, 4, 3 и 4. Найдем среднюю оценку. Складываем оценки: 5 + 4 + 3 + 4 = 16. Считаем их количество: всего 4 оценки. Делим сумму на количество: 16 / 4 = 4. Средняя оценка Амира за неделю составляет 4.<br><br><strong>Пример 2:</strong> В трех магазинах килограмм яблок стоит 80 рублей, 90 рублей и 100 рублей. Складываем цены: 80 + 90 + 100 = 270 рублей. Делим на количество магазинов (3): 270 / 3 = 90 рублей. Средняя цена яблок составляет 90 рублей.",
                        questions: [
                            { q: "Чему равно среднее арифметическое чисел 10, 20 и 30?", options: ["15", "20", "30"], correct: 1 },
                            { q: "Каким действием завершается алгоритм поиска среднего арифметического?", options: ["Умножением суммы на количество", "Делением суммы на количество", "Вычитанием меньшего числа из большего"], correct: 1 },
                            { q: "Если сумма четырех чисел равна 40, чему равно их среднее арифметическое?", options: ["10", "8", "160"], correct: 0 }
                        ]
                    },
                    {
                        id: "math_2",
                        title: "2. Проценты",
                        page: "Стр. 19",
                        theory: "<strong>Процент</strong> — это одна сотая часть любого числа или величины. Обозначается знаком %. Проценты используются для удобного сравнения долей, расчета скидок, начислений в банках и анализа изменения показателей.<br><br><strong>Алгоритм нахождения процента от числа:</strong><ul><li><strong>Шаг 1:</strong> Перевести число процентов в обыкновенную или десятичную дробь (разделить количество процентов на 100).</li><li><strong>Шаг 2:</strong> Умножить исходное число на полученную дробь.</li></ul><br><strong>Пример 1:</strong> Найдем 20% от числа 250. Переводим проценты в дробь: 20 / 100 = 0.2. Умножаем исходное число на полученную дробь: 250 * 0.2 = 50. Таким образом, 20% от 250 равен 50.<br><br><strong>Пример 2:</strong> Куртка стоит 4000 рублей, на нее действует скидка 15%. Найдем сумму скидки. Переводим 15% в дробь: 15 / 100 = 0.15. Умножаем цену на дробь: 4000 * 0.15 = 600 рублей. Скидка составляет 600 рублей.",
                        questions: [
                            { q: "Что представляет собой 1%?", options: ["Одна десятая часть", "Одна сотая часть", "Одна тысячная часть"], correct: 1 },
                            { q: "Как перевести 45% в десятичную дробь?", options: ["4.5", "0.45", "0.045"], correct: 1 },
                            { q: "Чему равны 50% от числа 80?", options: ["40", "20", "50"], correct: 0 }
                        ]
                    },
                    {
                        id: "math_3",
                        title: "3. Представление числовой информации в круговых диаграммах",
                        page: "Стр. 27",
                        theory: "<strong>Круговая диаграмма</strong> — это графическое изображение соотношения между частями целого в виде круга, разделенного на секторы. Весь круг принимает значение 100% и соответствует главному углу в 360 градусов.<br><br><strong>Алгоритм построения круговой диаграммы:</strong><ul><li><strong>Шаг 1:</strong> Вычислить долю каждой части от общего целого в процентах или дробях.</li><li><strong>Шаг 2:</strong> Умножить величину 360 градусов на полученную дробь каждого сектора для определения его градусной меры.</li><li><strong>Шаг 3:</strong> Построить круг и с помощью транспортира отложить рассчитанные углы для каждого сектора.</li></ul><br><strong>Пример 1:</strong> В классе 50% учеников занимаются спортом. Найдем угол сектора. Умножаем 360 градусов на 0.5 (50%): 360 * 0.5 = 180 градусов. Сектор спорта занимает ровно половину круга.<br><br><strong>Пример 2:</strong> В саду 25% деревьев — яблони. Находим угол сектора: 360 * 0.25 = 90 градусов. Сектор яблонь образует прямой угол на диаграмме.",
                        questions: [
                            { q: "Сколько градусов составляет полный угол круговой диаграммы?", options: ["180°", "360°", "100°"], correct: 1 },
                            { q: "Какой угол сектора соответствует 25% на круговой диаграмме?", options: ["90°", "180°", "45°"], correct: 0 },
                            { q: "Для чего используется круговая диаграмма?", options: ["Для наглядного изображения частей целого", "Для решения уравнений", "Для измерения длины отрезков"], correct: 0 }
                        ]
                    },
                    {
                        id: "math_4",
                        title: "4. Виды треугольников",

    title: 'Module 1a. Family members',
    page: 6,
    theory: "<strong>Тема: Family members (Члены семьи)</strong><br><br>В этой теме мы изучаем слова для обозначения членов семьи и притяжательный падеж существительных (Possessive 's).<br><br><strong>1. Грамматика: Possessive 's (Притяжательный падеж)</strong><br>Чтобы показать, что что-то принадлежит человеку, мы добавляем <strong>'s</strong> к имени или существительному в единственном числе:<br><ul><li>Утверждение: <strong>Name + 's + object/person</strong> (John's mother = мама Джона).</li><li>Если существительное во множественном числе оканчивается на -s, добавляем только апостроф: <strong>parents' house</strong> (дом родителей).</li><li>Вопросительная форма о принадлежности строится с помощью слова <strong>Whose...?</strong> (Чей? Чья? Чьи?): <strong>Whose mother is she?</strong> — She is John's mother.</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Mother / Mum</strong> — мама</li><li><strong>Father / Dad</strong> — папа</li><li><strong>Parents</strong> — родители</li><li><strong>Brother</strong> — брат</li><li><strong>Sister</strong> — сестра</li><li><strong>Grandfather / Grandpa</strong> — дедушка</li><li><strong>Grandmother / Grandma</strong> — бабушка</li><li><strong>Uncle</strong> — дядя</li><li><strong>Aunt</strong> — тётя</li><li><strong>Cousin</strong> — двоюродный брат / сестра</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>This is my mother's camera.</strong> — Это фотоаппарат моей мамы.</li><li><strong>Who is Pete? He is Ben's cousin.</strong> — Кто такой Пит? Он двоюродный брат Бена.</li><li><strong>My grandparents' house is very cozy.</strong> — Дом моих дедушки и бабушки очень уютный.</li></ul>",

    theory: "<strong>Тема: Who are you? (Личные и притяжательные местоимения)</strong><br><br>Для того чтобы правильно рассказывать о себе и других, важно различать личные местоимения (Subject Pronouns) и притяжательные местоимения (Possessive Adjectives).<br><br><strong>1. Грамматика: Subject vs Possessive Pronouns</strong><br>Личные местоимения отвечают на вопрос 'Кто? / Что?' и стоят перед глаголом. Притяжательные местоимения отвечают на вопрос 'Чей?' и всегда стоят перед существительным:<br><ul><li><strong>I</strong> (я) — <strong>My</strong> (мой/моя/моё)</li><li><strong>You</strong> (ты/вы) — <strong>Your</strong> (твой/ваш)</li><li><strong>He / She / It</strong> (он/она/оно) — <strong>His / Her / Its</strong> (его/её/его)</li><li><strong>We</strong> (мы) — <strong>Our</strong> (наш)</li><li><strong>They</strong> (они) — <strong>Their</strong> (их)</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Name</strong> — имя</li><li><strong>Surname / Last name</strong> — фамилия</li><li><strong>Age</strong> — возраст</li><li><strong>Student</strong> — ученик / студент</li><li><strong>Best friend</strong> — лучший друг</li><li><strong>Country of origin</strong> — страна происхождения</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>I am a student. My name is Alex.</strong> — Я ученик. Меня зовут Алекс.</li><li><strong>She is twelve years old. Her hobby is reading.</strong> — Ей двенадцать лет. Её хобби — чтение.</li><li><strong>They are in 6th grade. Their classroom is on the second floor.</strong> — Они в 6 классе. Их класс находится на втором этаже.</li></ul>",

    theory: "<strong>Тема: Happy times (Праздники и порядковые числительные)</strong><br><br>В этой теме мы научимся называть даты, дни рождения и правильно использовать порядковые числительные.<br><br><strong>1. Грамматика: Ordinal Numbers (Порядковые числительные)</strong><br>Порядковые числительные отвечают на вопрос 'Который по счету?'. Обычно они образуются путем добавления окончания <strong>-th</strong> к количественному числительному, но есть исключения:<br><ul><li><strong>Исключения:</strong> 1st = first, 2nd = second, 3rd = third.</li><li>Остальные: 4th = fourth, 5th = fifth, 12th = twelfth, 20th = twentieth.</li><li>С датами всегда используется предлог <strong>on</strong>: <strong>on the 5th of May</strong> (пятого мая).</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Birthday</strong> — день рождения</li><li><strong>Celebration</strong> — празднование</li><li><strong>Present / Gift</strong> — подарок</li><li><strong>Party</strong> — вечеринка</li><li><strong>Invited</strong> — приглашенный</li><li><strong>Months</strong> (January, February, March...) — месяцы</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>My birthday is on the 12th of October.</strong> — Мой день рождения двенадцатого октября.</li><li><strong>Today is his first day at school.</strong> — Сегодня его первый день в школе.</li><li><strong>We are planning a big birthday party.</strong> — Мы планируем большую вечеринку в честь дня рождения.</li></ul>",

    theory: "<strong>Тема: My place (Конструкция there is / there are и мебель)</strong><br><br>Учимся описывать свою комнату, дом и расположение предметов с помощью конструкции <strong>There is / There are</strong>.<br><br><strong>1. Грамматика: There is / There are</strong><br>Используется для указания на то, что где-то что-то находится:<br><ul><li><strong>There is + единственное число:</strong> There is a sofa in the living room. (В гостиной есть диван.)</li><li><strong>There are + множественное число:</strong> There are two chairs in the kitchen. (На кухне стоят два стула.)</li><li><strong>Отрицание:</strong> There is not (isn't) / There are not (aren't).</li><li><strong>Вопрос:</strong> Is there a desk in your room? / Are there any books on the table?</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Furniture</strong> — мебель</li><li><strong>Sofa / Couch</strong> — диван</li><li><strong>Armchair</strong> — кресло</li><li><strong>Wardrobe</strong> — шкаф для одежды</li><li><strong>Bookcase</strong> — книжный шкаф</li><li><strong>Carpet</strong> — ковер</li><li><strong>Desk</strong> — письменный стол</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>There is a comfortable armchair next to the window.</strong> — Рядом с окном стоит удобное кресло.</li><li><strong>Are there any posters on the wall? — Yes, there are.</strong> — На стене есть плакаты? — Да, есть.</li><li><strong>There isn't a TV in my bedroom.</strong> — В моей спальне нет телевизора.</li></ul>",

    theory: "<strong>Тема: My neighbourhood (Предлоги места и город)</strong><br><br>Изучаем названия объектов в городе и предлоги места (Prepositions of Place), чтобы уметь объяснять, где что находится.<br><br><strong>1. Грамматика: Prepositions of Place (Предлоги места)</strong><br>Предлоги показывают точное расположение предметов или зданий относительно друг друга:<br><ul><li><strong>Next to</strong> — рядом с</li><li><strong>Between</strong> — между (двумя объектами)</li><li><strong>Behind</strong> — позади, за</li><li><strong>In front of</strong> — перед</li><li><strong>Opposite</strong> — напротив</li><li><strong>Under / On / In</strong> — под / на / в</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Neighbourhood</strong> — район, соседство</li><li><strong>Supermarket</strong> — супермаркет</li><li><strong>Library</strong> — библиотека</li><li><strong>Cinema</strong> — кинотеатр</li><li><strong>Park</strong> — парк</li><li><strong>Post office</strong> — почта</li><li><strong>Bank</strong> — банк</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>The library is next to the school.</strong> — Библиотека находится рядом со школой.</li><li><strong>There is a beautiful park in front of my house.</strong> — Перед моим домом есть красивый парк.</li><li><strong>The bank is between the cinema and the post office.</strong> — Банк находится между кинотеатром и почтой.</li></ul>",

    title: 'Module 3a. Road safety',

    theory: "<strong>Тема: Road safety (Правила дорожного движения и модальный глагол can / can't)</strong><br><br>Учимся давать инструкции по безопасности на дорогах и выражать разрешение или запрет.<br><br><strong>1. Грамматика: Imperatives & Modal verb Can / Can't</strong><br>Для приказов и инструкций используются глаголы в повелительном наклонении, а для правил — модальные глаголы:<br><ul><li><strong>Imperatives (Повелительное наклонение):</strong> Look both ways! (Смотри в обе стороны!) Don't run across the road! (Не беги через дорогу!)</li><li><strong>Can / Can't (Можно / Нельзя):</strong> You can cross the street here. (Ты можешь перейти улицу здесь.) You can't park here. (Здесь нельзя парковаться.)</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Traffic lights</strong> — светофор</li><li><strong>Zebra crossing</strong> — пешеходный переход ('зебра')</li><li><strong>Pavement / Sidewalk</strong> — тротуар</li><li><strong>Seatbelt</strong> — ремень безопасности</li><li><strong>Pedestrian</strong> — пешеход</li><li><strong>Look both ways</strong> — смотреть в обе стороны</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>Always wear a seatbelt in the car.</strong> — Всегда пристёгивай ремень безопасности в машине.</li><li><strong>You can't cross the road when the traffic light is red.</strong> — Нельзя переходить дорогу, когда горит красный свет.</li><li><strong>Walk on the pavement, not on the road.</strong> — Ходи по тротуару, а не по проезжей части.</li></ul>",

    theory: "<strong>Тема: On the move (Транспорт и предлоги движения)</strong><br><br>Изучаем виды транспорта и правильное употребление предлогов с ними.<br><br><strong>1. Грамматика: Prepositions of Transport (by bus, on foot)</strong><br>Когда мы говорим о способе передвижения, мы используем предлог <strong>by</strong> с названиями транспорта, но есть важное исключение для пеших прогулок:<br><ul><li><strong>By + транспорт:</strong> by car (на машине), by train (на поезде), by bike (на велосипеде), by bus (на автобусе).</li><li><strong>Исключение (пешком):</strong> <strong>on foot</strong> (пешком).</li><li>Если перед транспортом есть притяжательное местоимение или артикль, используются предлоги <strong>in</strong> (для машин и такси) или <strong>on</strong> (для автобусов, поездов, самолетов): in my car, on the 8 o'clock bus.</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Bus</strong> — автобус</li><li><strong>Train</strong> — поезд</li><li><strong>Plane</strong> — самолёт</li><li><strong>Bicycle / Bike</strong> — велосипед</li><li><strong>Underground / Metro</strong> — метро</li><li><strong>Travel / Commute</strong> — путешествовать / ездить на работу/учебу</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>I usually go to school by bus.</strong> — Я обычно езжу в школу на автобусе.</li><li><strong>My father goes to work on foot because it is near.</strong> — Мой отец ходит на работу пешком, потому что это близко.</li><li><strong>They like to travel by train in summer.</strong> — Летом они любят путешествовать на поезде.</li></ul>",

  {
    id: 'eng_9',
    title: 'Module 3c. Hot wheels',
    page: 30,
    theory: "<strong>Тема: Hot wheels (Правила безопасности на дорогах и знаки)</strong><br><br>Учимся понимать знаки дорожного движения, давать указания и использовать модальный глагол <strong>must / mustn't</strong>.<br><br><strong>1. Грамматика: Modal verb Must / Mustn't (Обязан / Запрещено)</strong><br>Глагол <strong>must</strong> выражает строгую необходимость или правило, а <strong>mustn't</strong> — категорический запрет:<br><ul><li>Утверждение: <strong>Subject + must + V1</strong> (You must stop at the red light.)</li><li>Отрицание (Запрет): <strong>Subject + mustn't + V1</strong> (You mustn't ride a bike on the motorway.)</li><li>После must / mustn't частица <strong>to</strong> НЕ ставится!</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Helmet</strong> — шлем</li><li><strong>Speed limit</strong> — ограничение скорости</li><li><strong>Cycle lane</strong> — велосипедная дорожка</li><li><strong>Traffic sign</strong> — дорожный знак</li><li><strong>Safe / Dangerous</strong> — безопасный / опасный</li><li><strong>Fasten</strong> — пристёгивать</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>You must wear a helmet when riding a bike.</strong> — Ты обязан носить шлем во время езды на велосипеде.</li><li><strong>Drivers mustn't turn left here.</strong> — Водителям запрещено поворачивать налево здесь.</li><li><strong>Always stay on the cycle lane for your safety.</strong> — Всегда оставайтесь на велосипедной дорожке для вашей безопасности.</li></ul>",
    questions: [
      { q: "Что означает глагол 'mustn't'?", options: ["Можешь не делать", "Категорически запрещено", "Рекомендуется"], answer: 1 },

  {
    id: 'eng_10',
    title: 'Module 4a. Day in, Day out',
    page: 36,
    theory: "<strong>Тема: Day in, Day out (Present Simple: Настоящее простое время)</strong><br><br>Изучаем время Present Simple для описания повседневных дел, привычек и регулярного распорядка дня.<br><br><strong>1. Грамматика: Present Simple Tense</strong><br>Время используется для регулярных и повторяющихся действий:<br><ul><li><strong>Утверждение:</strong> I/You/We/They + V1 (I play). Для He/She/It добавляется окончание <strong>-s/-es</strong> (He plays, She watches).</li><li><strong>Отрицание:</strong> Subject + <strong>do not (don't) / does not (doesn't)</strong> + V1 (He doesn't play).</li><li><strong>Вопрос:</strong> <strong>Do / Does</strong> + Subject + V1? (Does she play piano?)</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Wake up / Get up</strong> — просыпаться / вставать с постели</li><li><strong>Brush teeth</strong> — чистить зубы</li><li><strong>Have breakfast / lunch / dinner</strong> — завтракать / обедать / ужинать</li><li><strong>Go to school</strong> — идти в школу</li><li><strong>Do homework</strong> — делать домашнее задание</li><li><strong>Go to bed</strong> — идти спать</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>I wake up at 7 o'clock every morning.</strong> — Я просыпаюсь в 7 часов каждое утро.</li><li><strong>She does her homework in the afternoon.</strong> — Она делает домашнее задание днём.</li><li><strong>Do you play football on Sundays? — Yes, I do.</strong> — Ты играешь в футбол по воскресеньям? — Да.</li></ul>",

    title: 'Module 4b. How about...?',
    page: 38,
    theory: "<strong>Тема: How about...? (Наречия частоты и внесение предложений)</strong><br><br>Учимся говорить о том, как часто мы что-то делаем (Adverbs of Frequency), и вежливо предлагать идеи для совместного досуга.<br><br><strong>1. Грамматика: Adverbs of Frequency (Наречия частоты)</strong><br>Наречия показывают периодичность действия и стоят ПЕРЕД смысловым глаголом, но ПОСЛЕ глагола <strong>to be</strong>:<br><ul><li><strong>Always</strong> (100% — всегда), <strong>Usually</strong> (80% — обычно), <strong>Often</strong> (60% — часто), <strong>Sometimes</strong> (30% — иногда), <strong>Never</strong> (0% — никогда).</li><li>Пример с глаголом action: I <strong>always clean</strong> my room.</li><li>Пример с глаголом to be: He <strong>is usually</strong> late.</li><li><strong>Внесение предложений:</strong> <strong>How about + V-ing...?</strong> (How about going to the park?)</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Always</strong> — всегда</li><li><strong>Usually</strong> — обычно</li><li><strong>Often</strong> — часто</li><li><strong>Sometimes</strong> — иногда</li><li><strong>Never</strong> — никогда</li><li><strong>Suggestion</strong> — предложение</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>She never drinks coffee in the evening.</strong> — Она никогда не пьёт кофе по вечерам.</li><li><strong>We are always happy to see our friends.</strong> — Мы всегда рады видеть наших друзей.</li><li><strong>How about watching a original film tonight?</strong> — Как насчет того, чтобы посмотреть интересный фильм сегодня вечером?</li></ul>",

    theory: "<strong>Тема: My favourite day (Дни недели, время суток и предлоги времени)</strong><br><br>Учимся рассказывать о своем любимом дне недели и правильно употреблять предлоги времени <strong>at, on, in</strong>.<br><br><strong>1. Грамматика: Prepositions of Time (AT, ON, IN)</strong><br>Правило 'треугольника времени':<br><ul><li><strong>AT</strong> — для точного времени и праздников: <i>at 5 o'clock, at noon, at night, at the weekend</i>.</li><li><strong>ON</strong> — для дней недели и конкретных дат: <i>on Monday, on my birthday, on the 1st of September</i>.</li><li><strong>IN</strong> — для веков, лет, месяцев и частей суток: <i>in 2026, in May, in the morning, in summer</i>.</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Days of the week</strong> (Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday)</li><li><strong>In the morning / afternoon / evening</strong> — утром / днем / вечером</li><li><strong>At night</strong> — ночью</li><li><strong>At the weekend</strong> — на выходных</li><li><strong>Favourite</strong> — любимый</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>On Saturdays I sleep until 10 o'clock.</strong> — По субботам я сплю до 10 часов.</li><li><strong>We always have a English lesson in the morning.</strong> — У нас всегда урок английского утром.</li><li><strong>The train arrives at 7:30 PM.</strong> — Поезд прибывает в 19:30.</li></ul>",

    id: 'eng_13',

    page: 46,
    theory: "<strong>Тема: Festive time (Праздничное время и Present Continuous)</strong><br><br>В этой теме мы изучаем праздники, традиции их празднования, а также настоящее длительное время (Present Continuous Tense) для описания действий, происходящих прямо сейчас.<br><br><strong>1. Грамматика: Present Continuous (Настоящее длительное время)</strong><br>Используется для действий, которые совершаются непосредственно в момент речи:<br><ul><li><strong>Формула:</strong> Subject + <strong>am / is / are + Verb-ing</strong></li><li><strong>Утверждение:</strong> I am decorating the tree. She is making a cake. They are dancing.</li><li><strong>Отрицание:</strong> Subject + <strong>am/is/are + not + Verb-ing</strong> (We aren't working now).</li><li><strong>Вопрос:</strong> <strong>Am / Is / Are</strong> + Subject + <strong>Verb-ing</strong>? (Is he writing a card?)</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Celebrate</strong> — праздновать</li><li><strong>Decorate the house</strong> — украшать дом</li><li><strong>Make a cake</strong> — печь торт</li><li><strong>Send greeting cards</strong> — отправлять поздравительные открытки</li><li><strong>Exchange gifts</strong> — обмениваться подарками</li><li><strong>Wear costumes</strong> — носить праздничные костюмы</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>Look! They are decorating the Christmas tree right now.</strong> — Посмотри! Они украшают елку прямо сейчас.</li><li><strong>What is mum doing? She is making a special festive cake.</strong> — Что делает мама? Она печет праздничный торт.</li><li><strong>We aren't watching TV at the moment, we are exchanging presents.</strong> — В данный момент мы не смотрим телевизор, мы обмениваемся подарками.</li></ul>",

    page: 48,
    theory: "<strong>Тема: Let's celebrate (Праздничная еда и исчисляемые / неисчисляемые существительные)</strong><br><br>Учимся описывать праздничное меню, а также использовать квантификаторы <strong>some / any / much / many</strong>.<br><br><strong>1. Грамматика: Countable / Uncountable & Some / Any</strong><br>Существительные бывают исчисляемыми (можно посчитать: <i>apples, burgers</i>) и неисчисляемыми (нельзя посчитать: <i>water, rice, sugar</i>):<br><ul><li><strong>Some</strong> — используется в утверждениях перед множественным числом или неисчисляемыми существительными: <i>There is some juice. There are some apples.</i></li><li><strong>Any</strong> — используется в отрицаниях и вопросах: <i>Is there any milk? There aren't any biscuits.</i></li><li><strong>Many</strong> — с исчисляемыми (<i>many apples</i>), <strong>Much</strong> — с неисчисляемыми (<i>much water</i>).</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Juice</strong> — сок</li><li><strong>Biscuits / Cookies</strong> — печенье</li><li><strong>Sandwich</strong> — бутерброд</li><li><strong>Sugar</strong> — сахар</li><li><strong>Flour</strong> — мука</li><li><strong>Preparation</strong> — приготовление</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>Is there any orange juice in the fridge?</strong> — В холодильнике есть апельсиновый сок?</li><li><strong>We need to buy some apples and flour for the pie.</strong> — Нам нужно купить яблок и муки для пирога.</li><li><strong>How many sandwiches do you want?</strong> — Сколько бутербродов ты хочешь?</li></ul>",

    page: 50,
    theory: "<strong>Тема: Special days (Особые дни и культурные традиции)</strong><br><br>В этой теме мы знакомимся с уникальными национальными праздниками стран мира и учимся сравнивать традиции.<br><br><strong>1. Грамматика: Present Simple vs Present Continuous</strong><br>Важно различать регулярные традиции и то, что происходит прямо сейчас:<br><ul><li><strong>Present Simple (регулярно, каждый год):</strong> People celebrate Thanksgiving every November. (Люди празднуют День благодарения каждый ноябрь.)</li><li><strong>Present Continuous (в данный момент):</strong> Look! The parade is starting right now! (Посмотри! Парад начинается прямо сейчас!)</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Parade</strong> — парад</li><li><strong>Firework display</strong> — салют, фейерверк</li><li><strong>Tradition</strong> — традиция</li><li><strong>Special meal</strong> — особое блюдо</li><li><strong>Wear traditional clothes</strong> — носить традиционную одежду</li><li><strong>Watch performance</strong> — смотреть представление</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>In Autumn, people in the USA celebrate Thanksgiving Day.</strong> — Осенью люди в США празднуют День благодарения.</li><li><strong>Listen! They are playing traditional music in the street.</strong> — Послушай! Они играют традиционную музыку на улице.</li><li><strong>We always watch the firework display at midnight.</strong> — Мы всегда смотрим фейерверк в полночь.</li></ul>",

    title: 'Module 6a. Free time',

    theory: "<strong>Тема: Free time (Свободное время и хобби)</strong><br><br>Разбираем увлечения, занятия в свободное время и использование глаголов связки <strong>like / love / hate + V-ing</strong>.<br><br><strong>1. Грамматика: Expressing Preferences (like / love / hate + V-ing)</strong><br>Когда мы рассказываем о том, что нам нравится или не нравится делать, после глаголов чувства мы добавляем глагол с окончанием <strong>-ing</strong>:<br><ul><li><strong>Love</strong> (обожать): I love reading books.</li><li><strong>Like / Enjoy</strong> (нравиться): She likes swimming in the pool.</li><li><strong>Don't like / Hate</strong> (не нравиться / ненавидеть): They hate playing chess.</li><li><strong>Вопрос:</strong> Do you like painting pictures?</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Free time / Leisure time</strong> — свободное время</li><li><strong>Reading books</strong> — чтение книг</li><li><strong>Cycling</strong> — катание на велосипеде</li><li><strong>Gardening</strong> — садоводство</li><li><strong>Painting</strong> — рисование красками</li><li><strong>Windsurfing</strong> — виндсерфинг</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>My brother loves cycling in the park on Sundays.</strong> — Мой брат обожает кататься на велосипеде в парке по воскресеньям.</li><li><strong>I don't like playing computer games, I prefer reading.</strong> — Мне не нравится играть в компьютерные игры, я предпочитаю чтение.</li><li><strong>Does she enjoy gardening? — Yes, she does.</strong> — Ей нравится заниматься садом? — Да.</li></ul>",

    page: 58,
    theory: "<strong>Тема: Game on! (Настольные и спортивные игры)</strong><br><br>Учимся говорить об играх, спорте и разнице в употреблении глаголов <strong>play, go, do</strong> со спортивными увлечениями.<br><br><strong>1. Грамматика: Verbs PLAY, GO, DO with sports</strong><br>В английском языке выбор глагола зависит от вида спорта или игры:<br><ul><li><strong>PLAY</strong> — для командных игр и игр с мячом/доской: <i>play chess, play football, play basketball, play Monopoly</i>.</li><li><strong>GO</strong> — для видов спорта, оканчивающихся на <strong>-ing</strong>: <i>go swimming, go skiing, go running</i>.</li><li><strong>DO</strong> — для боевых искусств, гимнастики и индивидуальных занятий: <i>do gymnastics, do karate, do athletics</i>.</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Board game</strong> — настольная игра</li><li><strong>Chess</strong> — шахматы</li><li><strong>Scrabble</strong> — скрабл (эрудит)</li><li><strong>Jigsaw puzzle</strong> — пазл</li><li><strong>Opponent</strong> — соперник</li><li><strong>Win / Lose</strong> — выигрывать / проигрывать</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>My grandfather and I play chess every weekend.</strong> — Мы с дедушкой играем в шахматы каждые выходные.</li><li><strong>She goes swimming twice a week.</strong> — Она ходит на плавание дважды в неделю.</li><li><strong>Do you do karate after school?</strong> — Ты занимаешься карате после школы?</li></ul>",

    id: 'eng_18',
    title: 'Module 6c. Pastimes',
    page: 60,
    theory: "<strong>Тема: Pastimes (Занятия и интересы школьников)</strong><br><br>Изучаем названия клубов по интересам и правила построения сложных предложений с союзами <strong>and, but, because</strong>.<br><br><strong>1. Грамматика: Linking words (And, But, Because)</strong><br>Союзы помогают объединять короткие предложения в связный и красивый текст:<br><ul><li><strong>And</strong> (и) — соединяет похожие идеи: <i>I like music and I play the guitar.</i></li><li><strong>But</strong> (но) — показывает контраст или противопоставление: <i>I like swimming, but I don't like running.</i></li><li><strong>Because</strong> (потому что) — объясняет причину: <i>I joined the drama club because I want to be an actor.</i></li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Pastime</strong> — времяпрепровождение, хобби</li><li><strong>Drama club</strong> — театральный кружок</li><li><strong>Art club</strong> — художественная студия</li><li><strong>Photography</strong> — фотография</li><li><strong>Member</strong> — участник, член клуба</li><li><strong>Join</strong> — присоединяться, вступать</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>He is a member of the art club because he loves painting.</strong> — Он состоит в художественном клубе, потому что любит рисовать.</li><li><strong>I want to join the drama club, but I am very shy.</strong> — Я хочу записаться в театральный кружок, но я очень стеснительный.</li><li><strong>She likes photography and she takes great photos.</strong> — Она увлекается фотографией и делает отличные снимки.</li></ul>",

    page: 66,
    theory: "<strong>Тема: In the past (Прошедшее простое время: Past Simple глагола to be)</strong><br><br>Изучаем выражения прошлого и формы глагола <strong>to be</strong> в прошедшем времени (<strong>was / were</strong>).<br><br><strong>1. Грамматика: Past Simple of To Be (Was / Were)</strong><br>В прошедшем времени глагол to be имеет две формы:<br><ul><li><strong>WAS</strong> — для единственного числа (I, He, She, It): <i>I was at home yesterday. She was happy.</i></li><li><strong>WERE</strong> — для множественного числа и 'you' (You, We, They): <i>We were at the cinema. They were tired.</i></li><li><strong>Отрицание:</strong> wasn't (was not) / weren't (were not).</li><li><strong>Вопрос:</strong> Was he at school? / Were you in the park?</li><li><strong>Маркеры времени:</strong> yesterday (вчера), last week (на прошлой неделе), 2 days ago (2 дня назад).</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Past</strong> — прошлое</li><li><strong>Yesterday</strong> — вчера</li><li><strong>Last night / week / year</strong> — прошлым вечером / на прошлой неделе / в прошлом году</li><li><strong>Ago</strong> — назад (в значении времени)</li><li><strong>Ghost town</strong> — город-призрак</li><li><strong>Quiet / Noisy</strong> — тихий / шумный</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>Where were you yesterday evening? — I was at the library.</strong> — Где ты был вчера вечером? — Я был в библиотеке.</li><li><strong>The town was very small fifty years ago.</strong> — Пятьдесят лет назад этот город был очень маленьким.</li><li><strong>They weren't at school last Monday.</strong> — Их не было в школе в прошлый понедельник.</li></ul>",

    page: 68,
    theory: "<strong>Тема: Halloween spirit (Past Simple правильных глаголов)</strong><br><br>Учимся рассказывать о событиях в прошлом с помощью правильных глаголов (Regular Verbs).<br><br><strong>1. Грамматика: Past Simple Regular Verbs</strong><br>Правильные глаголы образуют форму прошедшего времени путем добавления окончания <strong>-ed</strong>:<br><ul><li><strong>Утверждение:</strong> Subject + <strong>V-ed</strong> (walk -> walked, play -> played, watch -> watched).</li><li>Правила правописания: study -> stud<strong>ied</strong>, stop -> stop<strong>ped</strong>, live -> live<strong>d</strong>.</li><li><strong>Отрицание:</strong> Subject + <strong>did not (didn't) + V1</strong> (He didn't watch TV).</li><li><strong>Вопрос:</strong> <strong>Did</strong> + Subject + <strong>V1</strong>? (Did you play games?)</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Spirit</strong> — дух, настроение</li><li><strong>Scary</strong> — страшный</li><li><strong>Costume</strong> — костюм</li><li><strong>Pumpkin</strong> — тыква</li><li><strong>Carve</strong> — вырезать (по дереву/тыковке)</li><li><strong>Scream</strong> — кричать, вриск</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>We decorated the room and carved a pumpkin yesterday.</strong> — Вчера мы украсили комнату и вырезали тыкву.</li><li><strong>Did you watch a scary movie last night? — No, I didn't.</strong> — Ты смотрел страшный фильм вчера вечером? — Нет.</li><li><strong>She studied for the test all evening.</strong> — Она готовилась к тесту весь вечер.</li></ul>",
    questions: [

      { q: "Какой вспомогательный глагол используется в вопросах Past Simple?", options: ["Do", "Does", "Did"], answer: 2 },

    theory: "<strong>Тема: Famous firsts (Past Simple неправильных глаголов)</strong><br><br>Знакомимся с историческими фактами, великими людьми и правилами использования неправильных глаголов (Irregular Verbs).<br><br><strong>1. Грамматика: Past Simple Irregular Verbs</strong><br>Неправильные глаголы образуют прошедшее время НЕ по правилам. Их 2-ю форму нужно запоминать наизусть:<br><ul><li><strong>Примеры 2-й формы:</strong> go -> <strong>went</strong>, have -> <strong>had</strong>, see -> <strong>saw</strong>, write -> <strong>wrote</strong>, make -> <strong>made</strong>, come -> <strong>came</strong>.</li><li><strong>Утверждение:</strong> Subject + <strong>V2</strong> (Columbus discovered America / Yuri Gagarin flew into space).</li><li><strong>Отрицание и вопрос:</strong> Используется вспомогательный глагол <strong>did / didn't</strong>, и смысловой глагол ВОЗВРАЩАЕТСЯ в 1-ю форму: <i>Did you see him? He didn't go to school.</i></li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Famous</strong> — знаменитый</li><li><strong>Inventor</strong> — изобретатель</li><li><strong>Discover</strong> — совершать открытие</li><li><strong>Space</strong> — космос</li><li><strong>Century</strong> — век, столетие</li><li><strong>Achievement</strong> — достижение</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>Yuri Gagarin became the first man in space in 1961.</strong> — Юрий Гагарин стал первым человеком в космосе в 1961 году.</li><li><strong>I wrote an essay about a famous inventor yesterday.</strong> — Вчера я написал эссе о знаменитом изобретателе.</li><li><strong>Did you go to the history museum last week?</strong> — Ты ходил в исторический музей на прошлой неделе?</li></ul>",

    theory: "<strong>Тема: That's the rule (Правила проживания и модальные глаголы Must / Mustn't / Can)</strong><br><br>Учимся выражать правила, обязанность и запреты в публичных местах и дома.<br><br><strong>1. Грамматика: Rules & Regulations (Must / Mustn't / Can)</strong><br>Модальные глаголы помогают сформулировать правила поведения:<br><ul><li><strong>MUST</strong> — обязан сделать (правило/закон): <i>You must keep your room clean.</i></li><li><strong>MUSTN'T</strong> — строгий запрет (нельзя): <i>You mustn't make noise at night.</i></li><li><strong>CAN</strong> — разрешение (можно): <i>You can invite friends on Saturdays.</i></li><li>После модальных глаголов используется начальная форма глагола БЕЗ частицы <strong>to</strong>.</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Rule</strong> — правило</li><li><strong>Keep clean</strong> — держать в чистоте</li><li><strong>Make noise</strong> — шуметь</li><li><strong>Litter</strong> — мусорить</li><li><strong>Feed animals</strong> — кормить животных</li><li><strong>Permission</strong> — разрешение</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>You mustn't litter in the national park.</strong> — Запрещено мусорить в национальном парке.</li><li><strong>Students must turn off their phones during the test.</strong> — Ученики обязаны выключать телефоны во время теста.</li><li><strong>Can I play video games now? — Yes, you can.</strong> — Можно мне поиграть в видеоигры сейчас? — Да, можно.</li></ul>",

    id: 'eng_23',
    title: 'Module 8b. Shall we?',
    page: 78,
    theory: "<strong>Тема: Shall we? (Вежливые предложения и приглашения)</strong><br><br>Учимся приглашать друзей, вносить предложения и вежливо соглашаться или отказываться.<br><br><strong>1. Грамматика: Making Suggestions (Shall we...? / Let's... / Why don't we...?)</strong><br>Конструкции для внесения предложений и совместных планов:<br><ul><li><strong>Shall we + V1...?</strong> — <i>Shall we go to the cinema tonight?</i> (Может, сходим в кино сегодня вечером?)</li><li><strong>Let's + V1!</strong> — <i>Let's order a pizza!</i> (Давай закажем пиццу!)</li><li><strong>Why don't we + V1...?</strong> — <i>Why don't we visit Grandma?</i> (Почему бы нам не навестить бабушку?)</li><li><strong>Ответы:</strong> That's a great idea! (Отличная идея!) / I'd love to, but I'm busy. (С удовольствием, но я занят.)</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Suggestion</strong> — предложение</li><li><strong>Invite</strong> — приглашать</li><li><strong>Accept</strong> — принимать (приглашение)</li><li><strong>Refuse</strong> — отклонять, отказываться</li><li><strong>Busy</strong> — занятой</li><li><strong>Awesome idea</strong> — потрясающая идея</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>Shall we play computer games together? — That sounds great!</strong> — Сыграем вместе в компьютерные игры? — Звучит отлично!</li><li><strong>Let's go for a walk in the park!</strong> — Пойдём прогуляемся в парке!</li><li><strong>Why don't we buy some ice cream? — I'd love to, but I have no money.</strong> — Почему бы нам не купить мороженого? — Я бы с радостью, но у меня нет денег.</li></ul>",

    theory: "<strong>Тема: House Rules (Домашние обязанности и конструкция have to)</strong><br><br>Учимся рассказывать о домашних обязанностях и правилах проживания в семье.<br><br><strong>1. Грамматика: Have to / Don't have to (Вынужден / Не обязан)</strong><br>Конструкция <strong>have to</strong> выражает необходимость, вызванную обстоятельствами или правилами:<br><ul><li><strong>Утверждение:</strong> I/You/We/They <strong>have to</strong> clean the room. He/She <strong>has to</strong> walk the dog.</li><li><strong>Отрицание (Отсутствие необходимости):</strong> don't have to / doesn't have to (Не нужно / не обязан): <i>You don't have to wash dishes, I will do it.</i></li><li><strong>Вопрос:</strong> Do you have to get up early on Sunday?</li></ul><br><strong>2. Key Vocabulary (Словарь):</strong><br><ul><li><strong>Housework / Chores</strong> — работа по дому / обязанности</li><li><strong>Make the bed</strong> — застилать кровать</li><li><strong>Wash the dishes</strong> — мыть посуду</li><li><strong>Walk the dog</strong> — выгуливать собаку</li><li><strong>Take out the rubbish</strong> — выносить мусор</li><li><strong>Tidy the room</strong> — наводить порядок в комнате</li></ul><br><strong>3. Примеры использования в речи:</strong><br><ul><li><strong>I have to make my bed every morning.</strong> — Я должен заправлять свою кровать каждое утро.</li><li><strong>She doesn't have to cook dinner today because we are going to a café.</strong> — Ей не нужно готовить ужин сегодня, потому что мы идем в кафе.</li><li><strong>Do you have to take out the rubbish? — Yes, I do.</strong> — Ты должен выносить мусор? — Да.</li></ul>",

                { q: "Какой цикл используется для рисования правильных многоугольников?", options: ["Цикл 'for'", "Цикл без условий", "Ручной повтор"], correct: 0 }
            ]
        },
        {
            id: "info_17",
            title: "§ 17. Простые вычислительные алгоритмы и диалоговые программы",
            page: "Стр. 157–169",
            theory: "<strong>Программирование вычислительных алгоритмов:</strong> Включает запись математических выражений и последовательный ввод, обработку и вывод числовых данных.<br><br><strong>Условная конструкция 'if':</strong> Позволяет алгоритму выбирать путь выполнения в зависимости от истинности или ложности некоторого условия (разветвляющийся алгоритм).<br><br><strong>Диалоговые программы:</strong> Программы, организующие интерактивный обмен информацией с пользователем через запросы ввода данных и вывод результатов на экран.",
            questions: [
                { q: "Для чего нужна конструкция 'if' в программировании?", options: ["Для проверки условий и ветвления алгоритма", "Для организации циклов", "Для ввода текста с клавиатуры"], correct: 0 },
                { q: "Что такое диалоговая программа?", options: ["Программа, ведающая интерактивный обмен сообщениями с пользователем", "Программа, работающая без участия человека", "Программа для проверки жесткого диска"], correct: 0 },
                { q: "Какова главная особенность линейного вычислительного алгоритма?", options: ["Все команды выполняются строго последовательно друг за другом", "Команды повторяются бесконечно", "Команды выбираются случайным образом"], correct: 0 }
                        ]
                    }
                ]
         
        
        },
};
        // СОСТОЯНИЕ
        let currentUser = null;
        let activeSubject = null;
        let activeTopic = null;

        const SUBJECT_NAMES = {
            math: 'Математика',
            russian: 'Русский язык',
            english: 'Английский язык',
            info: 'Информатика'
        };

        // РАБОТА С ЛОКАЛЬНЫМ ХРАНИЛИЩЕМ
        function getProfile(userName) {
            const key = `profile_${userName}`;
            let profile = JSON.parse(localStorage.getItem(key));
            if (!profile) {
                profile = {
                    name: userName,
                    completedTopics: [], 
                    grades: [],          
                    errors: []           
                };
                localStorage.setItem(key, JSON.stringify(profile));
            }
            return profile;
        }

        function saveProfile(profile) {
            if (currentUser) {
                localStorage.setItem(`profile_${currentUser}`, JSON.stringify(profile));
            }
        }

        function login(userName) {
            currentUser = userName;
            getProfile(userName);
            
            document.getElementById('user-display').innerText = `Ученик: ${userName}`;
            document.getElementById('app').style.display = 'block';

            nav('dashboard');
        }

        function logout() {
            currentUser = null;
            activeSubject = null;
            activeTopic = null;
            
            document.getElementById('app').style.display = 'none';
            nav('auth');
        }

        // НАВИГАЦИЯ
        function nav(screen, param = null) {
            const screens = ['screen-auth', 'screen-dashboard', 'screen-topics', 'screen-lesson', 'screen-profile'];
            screens.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.style.display = 'none';
                    el.classList.remove('active');
                }
            });

            if (!currentUser && screen !== 'auth') {
                screen = 'auth';
            }

            const target = document.getElementById(`screen-${screen}`);
            if (target) {
                target.style.display = 'block';
                target.classList.add('active');
            }

            switch (screen) {
                case 'dashboard':
                    activeSubject = null;
                    activeTopic = null;
                    renderDashboard();
                    break;
                case 'topics':
                    if (param) activeSubject = param;
                    renderTopics(activeSubject);
                    break;
                case 'lesson':
                    if (param) activeTopic = param;
                    renderLesson(activeSubject, activeTopic);
                    break;
                case 'profile':
                    renderProfile();
                    break;
            }
        }

        // ДАШБОРД
        function renderDashboard() {
            const container = document.getElementById('dashboard-cards');
            if (!container) return;

            const profile = getProfile(currentUser);
            let html = '';

            for (const subjectKey in DATABASE) {
                const subjectData = DATABASE[subjectKey];
                const topics = subjectData.topics || [];
                const total = topics.length;
                
                const completedCount = topics.filter(t => profile.completedTopics.includes(t.id)).length;
                const percent = total > 0 ? Math.round((completedCount / total) * 100) : 0;
                const title = SUBJECT_NAMES[subjectKey] || subjectKey;

                html += `
                    <div class="subject-card" onclick="nav('topics', '${subjectKey}')">
                        <div>
                            <h3>${title}</h3>
                            <p>Пройдено: ${completedCount} из ${total} тем (${percent}%)</p>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-bar" style="width: ${percent}%;"></div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // СПИСОК ТЕМ
        function renderTopics(subjectKey) {
            const container = document.getElementById('topics-list');
            const titleElem = document.getElementById('subject-title');
            const breadSubject = document.getElementById('bread-subject');
            
            if (!container) return;

            const subjectData = DATABASE[subjectKey];
            if (!subjectData) return;

            const subjectName = SUBJECT_NAMES[subjectKey] || subjectKey;
            if (titleElem) titleElem.innerText = subjectName;
            if (breadSubject) breadSubject.innerText = subjectName;

            const profile = getProfile(currentUser);
            const topics = subjectData.topics || [];
            let html = '';

            topics.forEach((topic, index) => {
                const isDone = profile.completedTopics.includes(topic.id);
                const statusBadge = isDone 
                    ? `<span class="status-badge badge-done">✅ Пройдено</span>` 
                    : `<span class="status-badge badge-todo">⏳ Не пройдено</span>`;

                html += `
                    <div class="topic-item" onclick="nav('lesson', '${topic.id}')">
                        <div class="topic-info">
                            <h4>Тема ${index + 1}: ${topic.title}</h4>
                            <p>${topic.page}</p>
                        </div>
                        ${statusBadge}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // РЕНДЕР УРОКА И ТЕСТА
        function renderLesson(subjectKey, topicId) {
            const container = document.getElementById('lesson-content');
            const breadSubject2 = document.getElementById('bread-subject-2');
            const breadTopic = document.getElementById('bread-topic');
            if (!container) return;

            const subjectData = DATABASE[subjectKey];
            if (!subjectData) return;

            const topic = subjectData.topics.find(t => t.id === topicId);
            if (!topic) return;

            if (breadSubject2) breadSubject2.innerText = SUBJECT_NAMES[subjectKey];
            if (breadTopic) breadTopic.innerText = topic.title;

            let questionsHtml = '';
            topic.questions.forEach((q, qIndex) => {
                let optionsHtml = '';
                q.options.forEach((opt, oIndex) => {
                    optionsHtml += `
                        <label class="option-label">
                            <input type="radio" name="question_${qIndex}" value="${oIndex}">
                            <span>${opt}</span>
                        </label>
                    `;
                });

                questionsHtml += `
                    <div class="quiz-question">
                        <p>Вопрос ${qIndex + 1}: ${q.q}</p>
                        <div class="options-group">${optionsHtml}</div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="lesson-card">
                    <h2>${topic.title}</h2>
                    <p style="color: var(--text-muted); margin-bottom: 16px;"><strong>Раздел в учебнике:</strong> ${topic.page}</p>
                    <div class="lesson-content">
                        <h3>Теоретический материал</h3>
                        <p>${topic.theory}</p>
                    </div>
                </div>

                <div class="quiz-section">
                    <h3 style="margin-bottom: 20px;">Проверка знаний (Тест)</h3>
                    <form id="quiz-form">
                        <div id="quiz-container">${questionsHtml}</div>
                        <button type="button" class="btn btn-primary" style="margin-top: 20px; width: 100%; padding: 14px;" onclick="submitQuiz('${subjectKey}', '${topic.id}')">Завершить тест</button>
                    </form>
                </div>
            `;
        }

        // ЗАВЕРШЕНИЕ ТЕСТА
        function submitQuiz(subjectKey, topicId) {
            const subjectData = DATABASE[subjectKey];
            if (!subjectData) return;

            const topic = subjectData.topics.find(t => t.id === topicId);
            if (!topic) return;

            const form = document.getElementById('quiz-form');
            if (!form) return;

            let correctCount = 0;
            const profile = getProfile(currentUser);

            topic.questions.forEach((q, qIndex) => {
                const selected = form.querySelector(`input[name="question_${qIndex}"]:checked`);
                const selectedVal = selected ? parseInt(selected.value) : -1;

                if (selectedVal === q.correct) {
                    correctCount++;
                } else {
                    const selectedText = selectedVal !== -1 ? q.options[selectedVal] : 'Ответ не выбран';
                    profile.errors.push({
                        subjectKey: subjectKey,
                        topicTitle: topic.title,
                        question: q.q,
                        selected: selectedText,
                        correct: q.options[q.correct]
                    });
                }
            });

            let grade = 2;
            if (correctCount === 3) grade = 5;
            else if (correctCount === 2) grade = 4;
            else if (correctCount === 1) grade = 3;

            if (!profile.completedTopics.includes(topicId)) {
                profile.completedTopics.push(topicId);
            }

            profile.grades.push({
                subjectKey: subjectKey,
                topicTitle: topic.title,
                score: `${correctCount}/3`,
                grade: grade,
                date: new Date().toLocaleDateString()
            });

            saveProfile(profile);

            alert(`Тест завершен!\nПравильных ответов: ${correctCount} из 3.\nВаша оценка: ${grade}`);
            nav('topics', subjectKey);
        }

        // ЛИЧНЫЙ КАБИНЕТ
        function renderProfile() {
            const container = document.getElementById('profile-content');
            if (!container) return;

            const profile = getProfile(currentUser);

            let totalTopicsCount = 0;
            for (const key in DATABASE) {
                totalTopicsCount += DATABASE[key].topics.length;
            }
            const overallPercent = totalTopicsCount > 0 
                ? Math.round((profile.completedTopics.length / totalTopicsCount) * 100) 
                : 0;

            let gradesRows = '';
            if (profile.grades.length === 0) {
                gradesRows = `<tr><td colspan="4" style="color: var(--text-muted); text-align: center;">Тесты еще не пройдены</td></tr>`;
            } else {
                profile.grades.slice().reverse().forEach(g => {
                    gradesRows += `
                        <tr>
                            <td>${SUBJECT_NAMES[g.subjectKey] || g.subjectKey}</td>
                            <td>${g.topicTitle}</td>
                            <td>${g.score}</td>
                            <td><span class="grade-badge grade-${g.grade}">${g.grade}</span></td>
                        </tr>
                    `;
                });
            }

            let errorsHtml = '';
            if (profile.errors.length === 0) {
                errorsHtml = `<p style="color: var(--text-muted);">Ошибок пока нет. Отличная работа!</p>`;
            } else {
                profile.errors.slice().reverse().forEach(err => {
                    errorsHtml += `
                        <div class="error-item">
                            <strong>[${SUBJECT_NAMES[err.subjectKey]}] ${err.topicTitle}</strong><br>
                            <em>Вопрос:</em> ${err.question}<br>
                            <span style="color: var(--danger);">Ваш ответ: ${err.selected}</span> | 
                            <span style="color: var(--success);">Правильный: ${err.correct}</span>
                        </div>
                    `;
                });
            }

            container.innerHTML = `
                <h2 style="margin-bottom: 24px;">Личный кабинет: ${profile.name}</h2>

                <div class="profile-grid">
                    <div class="stat-card">
                        <h3>Общий прогресс обучения</h3>
                        <p style="color: var(--text-muted);">Изучено ${overallPercent}% курса за 6 класс</p>
                        <div class="progress-bar-container">
                            <div class="progress-bar" style="width: ${overallPercent}%;"></div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <h3>Оценки и результаты тестов</h3>
                        <table class="results-table">
                            <thead>
                                <tr>
                                    <th>Предмет</th>
                                    <th>Тема</th>
                                    <th>Результат</th>
                                    <th>Оценка</th>
                                </tr>
                            </thead>
                            <tbody>${gradesRows}</tbody>
                        </table>
                    </div>

                    <div class="stat-card">
                        <h3>Список допущенных ошибок</h3>
                        <div class="errors-list">${errorsHtml}</div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
